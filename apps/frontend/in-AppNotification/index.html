<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notification Drawer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="notification-wrapper">
    <button id="bell-btn" class="bell-btn" aria-label="Notifications">
      <svg class="bell-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
      </svg>
      <span id="unread-badge" class="badge">0</span>
    </button>

    <div id="notification-drawer" class="drawer hidden">
      <div class="drawer-header">
        <div class="header-title">
          <h3>Notifications</h3>
          <span id="header-unread-count" class="count-pill">0 new</span>
        </div>
        <button id="close-drawer-btn" class="icon-btn">&times;</button>
      </div>

      <div class="drawer-controls">
        <div class="filter-buttons">
          <button id="filter-all-btn" class="filter-btn active">All</button>
          <button id="filter-unread-btn" class="filter-btn">Unread</button>
        </div>
        <button id="mark-all-read-btn" class="text-btn">Mark all as read</button>
      </div>

      <div id="notification-list" class="notification-list">
        </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
