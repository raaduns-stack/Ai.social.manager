name: Deploy SocialPilot AI to Production

# Trigger the workflow only when code is pushed to the main branch
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: SSH into server and execute deployment sequence
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            cd /var/www/raasocial_io_usr/data/www/raasocial.io
            
            # 1. Fetch and pull latest code
            git fetch origin
            git reset --hard origin/main
            
            # 2. Install dependencies
            npm install
            
            # 3. Build workspace applications
            npm run build --workspace=apps/backend
            npm run build --workspace=apps/frontend
            
            # 4. Sync compiled static assets to backend
            rm -rf apps/backend/public
            cp -r apps/frontend/dist apps/backend/public
            
            # 5. Restart PM2 backend process
            pm2 restart socialpilot-backend --update-env
